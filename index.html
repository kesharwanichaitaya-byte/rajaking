  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(16, 21, 33, 0.78);
      --card-border: rgba(234, 179, 8, 0.2);
      --gold-primary: #f59e0b;
      --gold-light: #fbbf24;
      --gold-btn-gradient: linear-gradient(90deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 96px;
    }

    /* Ambient Pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(245, 158, 11, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      height: 340px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 24px 18px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Compliance & Credibility Pills */
    .pills-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .pill {
      background: rgba(22, 27, 42, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #fde68a;
      display: flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
    }

    .channel-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .sub-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .main-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 40%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
    }

    .main-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    /* Live Update Notice */
    .urgent-banner {
      width: 100%;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: 12px;
      color: #fef3c7;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.4s infinite;
      margin-right: 6px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* CTA Button */
    .cta-btn {
      width: 100%;
      background: var(--gold-btn-gradient);
      color: #0b0908;
      font-weight: 800;
      font-size: 14px;
      padding: 16px 18px;
      border-radius: 14px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.32);
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      transition: transform 0.15s ease;
    }

    .cta-btn:active {
      transform: scale(0.98);
    }

    .cta-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 50%;
      height: 200%;
      background: linear-gradient(60deg, transparent 20%, rgba(255,255,255,0.4) 50%, transparent 80%);
      transform: rotate(25deg);
      animation: shimmer 2.8s infinite;
    }

    @keyframes shimmer {
      0% { left: -60%; }
      100% { left: 140%; }
    }

    .tg-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Main Container Card */
    .main-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 20px 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
    }

    .channel-profile-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 16px;
      margin-bottom: 16px;
    }

    .verified-label {
      font-size: 10px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }

    .channel-name {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar-wrapper {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #92400e);
      padding: 2px;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .avatar-inner span.crown {
      font-size: 17px;
      line-height: 1;
    }

    .avatar-inner span.code {
      font-size: 8px;
      font-weight: 800;
      color: #fbbf24;
      margin-top: 2px;
    }

    /* 4 Compliant Feature Grid Cards */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .feature-card {
      background: rgba(22, 29, 46, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 13px 10px;
    }

    .feature-icon {
      font-size: 20px;
      margin-bottom: 6px;
      display: inline-block;
    }

    .feature-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .feature-desc {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* Analysis Coverage Metrics */
    .section-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #f59e0b;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .metric-item {
      margin-bottom: 12px;
    }

    .metric-item:last-child {
      margin-bottom: 0;
    }

    .metric-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #e2e8f0;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #d97706, #fbbf24);
      border-radius: 999px;
    }

    /* Meta Compliance Footer & Disclaimer */
    .compliance-box {
      width: 100%;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px;
      font-size: 10.5px;
      color: #94a3b8;
      line-height: 1.5;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    .compliance-links {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 10px;
    }

    .compliance-links a {
      color: #cbd5e1;
      text-decoration: underline;
      font-size: 10px;
      cursor: pointer;
    }

    /* Mobile Sticky Bar */
    .sticky-bottom-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(7, 9, 14, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(245, 158, 11, 0.2);
      padding: 12px 18px;
      display: flex;
      justify-content: center;
      z-index: 99;
    }

    .sticky-btn {
      width: 100%;
      max-width: 440px;
      margin: 0;
      padding: 14px 18px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
    }
  </style>
</head>
